services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Synology Let's Encrypt certs — adjust path to match your DSM cert folder
      - /usr/syno/etc/certificate/_archive/DEFAULT:/etc/nginx/certs:ro
    depends_on:
      - backend
      - web
    restart: unless-stopped

  backend:
    # Prebuilt by CI and pulled from GHCR (override the tag via IMAGE_TAG in .env).
    # To build from source on the NAS instead, replace this line with: build: ./backend
    image: ghcr.io/maxliem9/homebase-backend:${IMAGE_TAG:-latest}
    expose:
      - "8080"
    env_file: .env
    environment:
      # note image storage — persisted in the named volume below; back it up with pgdata
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    # Prebuilt by CI and pulled from GHCR (override the tag via IMAGE_TAG in .env).
    # To build from source on the NAS instead, replace this line with: build: ./web
    image: ghcr.io/maxliem9/homebase-web:${IMAGE_TAG:-latest}
    expose:
      - "3000"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    expose:
      - "5432"
    environment:
      POSTGRES_DB: homebase
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d homebase"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
