services:
  backend:
    # Prebuilt by CI and pulled from GHCR (override the tag via IMAGE_TAG in .env).
    # To build from source on the NAS instead, replace this line with: build: ./backend
    image: ghcr.io/maxliem9/homebase-backend:${IMAGE_TAG:-latest}
    expose:
      - "8080"
    env_file: .env
    environment:
      # note image storage — persisted in the named volume below; back it up with pgdata
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    # Prebuilt by CI and pulled from GHCR (override the tag via IMAGE_TAG in .env).
    # To build from source on the NAS instead, replace this line with: build: ./web
    image: ghcr.io/maxliem9/homebase-web:${IMAGE_TAG:-latest}
    # Single entry point: serves the SPA and proxies /api + WebSocket to the
    # backend. Published on localhost only — point Synology's reverse proxy at
    # http://localhost:3000 (DSM terminates HTTPS with an auto-renewing cert).
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    expose:
      - "5432"
    environment:
      POSTGRES_DB: homebase
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d homebase"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
