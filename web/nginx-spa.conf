# Native image loads (Android Coil) carry the JWT as a ?token= query param — the
# documented last-resort auth path (see backend plugins/Authentication.kt). The
# default access log would persist those 30-day bearer tokens in plaintext, so the
# request line is rewritten for logging only (the proxied request is untouched).
# This file is included from conf.d, i.e. http context — map/log_format are valid here.
# The greedy prefix masks the LAST token= in the line and is case-sensitive — fine
# here: real clients send exactly one (Coil's image URL; the web WS uses the
# Sec-WebSocket-Protocol header, never a query token) and Ktor reads `token` case-
# sensitively, so an uppercase TOKEN= is never a working credential anyway.
map $request $request_log {
    ~^(?<pre>.*[?&]token=)[^&\s]*(?<post>.*)$ "${pre}***${post}";
    default                                   $request;
}
# The stock "combined" format with $request swapped for the masked variant.
log_format redacted '$remote_addr - $remote_user [$time_local] '
                    '"$request_log" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

# Only log failed requests (4xx/5xx). Every successful request — SPA assets, REST calls, WS
# upgrades (101) — used to land in the access log, and on the Synology NAS each container log line
# is a write into dockerd's per-container log store, keeping the HDDs busy 24/7. Errors stay
# visible here (incl. 502/504 while the backend restarts, which the crit-only error log below
# deliberately hides), still token-masked via the redacted format.
map $status $loggable {
    ~^[45]  1;
    default 0;
}

server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Token-masked access log (the image symlinks this path to stdout), errors only (see map above).
    access_log /var/log/nginx/access.log redacted if=$loggable;

    # Allow note image uploads (backend caps each image at MAX_UPLOAD_MB, default 10).
    client_max_body_size 12m;

    # API + WebSocket → backend (same compose network). This makes the web
    # container the single entry point, so the host's reverse proxy (Synology
    # DSM) only needs to forward to this one service.
    location /api/ {
        # The error log can't be format-masked and would print full URLs (incl.
        # ?token=) on upstream hiccups, e.g. 502s while the backend restarts during
        # a deploy. crit silences those; failures stay visible as 502/504 in the
        # masked access log above.
        error_log /var/log/nginx/error.log crit;

        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
