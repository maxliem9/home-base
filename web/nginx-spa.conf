server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Allow note image uploads (backend caps each image at MAX_UPLOAD_MB, default 10).
    client_max_body_size 12m;

    # API + WebSocket → backend (same compose network). This makes the web
    # container the single entry point, so the host's reverse proxy (Synology
    # DSM) only needs to forward to this one service.
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
