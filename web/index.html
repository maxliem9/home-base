<!doctype html>
<html lang="de" data-theme="light" data-look="klar" data-density="regular">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HomeBase</title>
    <!-- HB-06 — "Zwei Dächer" brand icon/favicon (PWA / tab / Apple-Touch) -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#b06f57" />
    <!-- Cold-start loading screen: shown inside #root before the JS bundle parses and
         React mounts (esp. PWA cold launch on a slow connection, where the user is
         already logged in via localStorage). React's render() replaces #root's
         children on mount, so it clears itself — no JS needed. Styles are inlined so
         they apply before index.css loads; colors match the PWA splash (#f1f3ec) and
         the clay brand accent (#b06f57), since the document starts in light theme
         until the per-user theme GET resolves. -->
    <style>
      #hb-boot {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: #f1f3ec;
      }
      #hb-boot .hb-boot__spinner {
        width: 38px; height: 38px; border-radius: 50%;
        border: 3px solid rgba(176, 111, 87, 0.22); border-top-color: #b06f57;
        animation: hb-boot-spin 0.8s linear infinite;
      }
      @keyframes hb-boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #hb-boot .hb-boot__spinner { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="hb-boot" role="status" aria-label="Lädt…">
        <div class="hb-boot__spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
