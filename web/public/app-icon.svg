<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="HomeBase">
  <!--
    HomeBase App-Icon: flache Ton-Kachel + weißes Haus-Outline.
    Ablösung des früheren "Zwei Dächer"-Marks (HB-06 / #240) — bewusst reduziert:
    keine Verläufe, kein Schlagschatten, eine einzige Strichfigur. Das trägt bis
    16px runter und bleibt in hell wie dunkel lesbar.

    Kachel: rx/Seite = 116/480 = 0.242 (Squircle-Anmutung wie bisher).
    Marke: Haus-Outline auf 24er-Raster, per transform auf die Mitte skaliert
    (translate(128,128) scale(10.6667) => Glyphe 213x213px, ~42% des Canvas).
    Weil die Gruppe skaliert, skaliert stroke-width mit: 2 * 10.6667 = 21.3px.
  -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="#8C5A4E"></rect>

  <g transform="translate(128,128) scale(10.6666667)" fill="none" stroke="#FFFFFF"
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
  </g>
</svg>
