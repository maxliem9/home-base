<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="HomeBase">
  <!--
    Favicon-Variante der Marke (app-icon.svg). Bewusst NICHT 1:1 herunterskaliert:
    bei 16px wäre der 4.2%-Strich des großen Icons unter 1px und würde weggrauen.
    Deshalb hier Glyphe etwas größer (~48% statt ~42% der Kachel) und Strich dicker
    (stroke-width 2.6 statt 2 auf dem 24er-Raster => ~6.9% der Kachel).
  -->
  <rect x="2" y="2" width="60" height="60" rx="14.5" fill="#8C5A4E"></rect>

  <g transform="translate(11.6,11.6) scale(1.7)" fill="none" stroke="#FFFFFF"
     stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
  </g>
</svg>
