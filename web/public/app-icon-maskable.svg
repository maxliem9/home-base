<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="HomeBase">
  <!--
    Maskable-Variante von app-icon.svg: randlose Kachel (keine eigene Rundung, kein
    Rand) — die Form macht die OS-Maske. Die Marke bleibt identisch positioniert und
    liegt damit in der zentralen Safe-Zone: maximaler Abstand eines gezeichneten
    Punktes vom Mittelpunkt sind die unteren Hausecken mit ~132px < 205px (80%-Kreis).
  -->
  <rect x="0" y="0" width="512" height="512" fill="#8C5A4E"></rect>

  <g transform="translate(128,128) scale(10.6666667)" fill="none" stroke="#FFFFFF"
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
  </g>
</svg>
