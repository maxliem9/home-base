<!DOCTYPE html>
<!--
  HomeBase Android — single-screen viewer.
  Companion to "HomeBase Android.html" (which shows every screen as a design
  canvas). This renders ONE phone screen, selected via ?screen=<global>, centred
  on a paper background — used to generate the README screenshots in
  docs/screenshots/. Example: screen.html?screen=ScreenHeute
-->
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HomeBase — Android-Screen</title>
  <link rel="stylesheet" href="android/hb-mobile.css" />
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      background: #efeee9;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 36px;
    }
    * { box-sizing: border-box; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="android/android-frame.jsx"></script>
  <script type="text/babel" src="android/m-shell.jsx"></script>
  <script type="text/babel" src="android/m-screens-heute.jsx"></script>
  <script type="text/babel" src="android/m-screens-aufgaben.jsx"></script>
  <script type="text/babel" src="android/m-screens-einkauf.jsx"></script>
  <script type="text/babel" src="android/m-screens-notizen.jsx"></script>
  <script type="text/babel" src="android/m-screens-zeit.jsx"></script>
  <script type="text/babel" src="android/m-screens-rezepte.jsx"></script>
  <script type="text/babel" src="holidays.jsx"></script>
  <script type="text/babel" src="android/m-screens-abwesenheit.jsx"></script>

  <script type="text/babel">
    const params = new URLSearchParams(location.search);
    const name = params.get("screen") || "ScreenHeute";
    const Comp = window[name] || window.ScreenHeute;
    ReactDOM.createRoot(document.getElementById("root"))
      .render(<div className="hbphone"><Comp /></div>);
  </script>
</body>
</html>
