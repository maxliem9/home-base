<!DOCTYPE html>
<!--
  HomeBase Web — Abwesenheit (Familienkalender) viewer.
  Standalone harness for the absence-calendar design bundle in ./abwesenheit/,
  which isn't wired into the trimmed HomeBase.html app. Renders AbwesenheitView
  with an in-memory 2026 demo seed (the shared seed.jsx carries no absence data).
  Used to generate the README screenshots in docs/screenshots/.
  Params: ?theme=light|dark  ?layout=raster|monat
-->
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HomeBase — Abwesenheit</title>
  <link rel="stylesheet" href="src/styles.css" />
  <link rel="stylesheet" href="src/looks.css" />
  <link rel="stylesheet" href="src/views.css" />
  <link rel="stylesheet" href="abwesenheit/abw.css" />
  <style> body { margin: 0; } .hb-app { min-height: 100vh; } </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- shared primitives from the parent app -->
  <script type="text/babel" src="src/seed.jsx"></script>
  <script type="text/babel" src="src/icons.jsx"></script>
  <script type="text/babel" src="src/ui.jsx"></script>
  <!-- absence bundle (load order: holidays → core → grid → view) -->
  <script type="text/babel" src="abwesenheit/holidays.jsx"></script>
  <script type="text/babel" src="abwesenheit/abw_core.jsx"></script>
  <script type="text/babel" src="abwesenheit/abw_grid.jsx"></script>
  <script type="text/babel" src="abwesenheit/views_abwesenheit.jsx"></script>

  <script type="text/babel">
    const params = new URLSearchParams(location.search);
    const theme = params.get("theme") === "dark" ? "dark" : "light";
    const layout = params.get("layout") === "monat" ? "monat" : "raster";
    const r = document.documentElement;
    r.dataset.look = "klar"; r.dataset.theme = theme; r.dataset.density = "regular";
    r.style.setProperty("--accent-hue", 35);

    const Y = new Date().getFullYear();
    // per-person config: different Bundesländer → different public holidays
    const absSettings = [
      { user_id: "max", state: "BE", allowance: 30, carryover: 5, carryoverExpires: `${Y}-03-31`, kindKrankCap: 15 },
      { user_id: "lea", state: "BY", allowance: 24, carryover: 3, carryoverExpires: `${Y}-03-31`, kindKrankCap: 15 },
    ];
    const parttime = [
      { id: "pt1", user_id: "max", weekday: 1, start: `${Y}-01-01`, end: `${Y}-04-30` }, // Max: Mo frei Jan–Apr
      { id: "pt2", user_id: "lea", weekday: 5, start: `${Y}-03-01`, end: null },          // Lea: Fr frei ab März
    ];
    const kitaClosures = ["05-26", "08-10", "08-11", "08-12", "08-13", "08-14", "12-24", "12-31"]
      .map((md, i) => ({ id: `k${i}`, date: `${Y}-${md}`, label: "Kita zu" }));

    const dbBase = { absSettings, parttime, kitaClosures, absences: [] };
    // expand a range into per-workday absence rows (skips weekends/holidays/part-time-free)
    const span = (user_id, type, from, to, half = null) =>
      ABW.eachDate(from, to)
        .filter((ds) => ABW.isWorkdayFor(dbBase, user_id, ds))
        .map((ds) => ({ id: `${user_id}-${ds}`, user_id, date: ds, type, half }));

    const absences = [
      ...span("max", "URLAUB", `${Y}-02-16`, `${Y}-02-20`),
      ...span("max", "URLAUB", `${Y}-07-13`, `${Y}-07-24`),
      ...span("max", "URLAUB", `${Y}-12-21`, `${Y}-12-31`),
      { id: "max-half", user_id: "max", date: `${Y}-05-15`, type: "URLAUB", half: "vm" },
      ...span("max", "KRANK", `${Y}-03-10`, `${Y}-03-11`),
      { id: "max-kk", user_id: "max", date: `${Y}-11-09`, type: "KIND_KRANK" },
      ...span("lea", "URLAUB", `${Y}-04-07`, `${Y}-04-10`),
      ...span("lea", "URLAUB", `${Y}-08-03`, `${Y}-08-14`),
      ...span("lea", "URLAUB", `${Y}-12-21`, `${Y}-12-31`),
      { id: "lea-k", user_id: "lea", date: `${Y}-09-22`, type: "KRANK" },
      ...span("lea", "KIND_KRANK", `${Y}-11-09`, `${Y}-11-10`),
    ];

    const db = { ...dbBase, absences, users: HB.users };
    const api = new Proxy({}, { get: () => () => {} });
    const colors = { urlaubMax: 150, urlaubChen: 250, krank: 27, kind: 62, feier: 288 };

    ReactDOM.createRoot(document.getElementById("root")).render(
      <main className="hb-main">
        <AbwesenheitView db={db} api={api} theme={theme} forcedLayout={layout} colors={colors} />
      </main>
    );
  </script>
</body>
</html>
