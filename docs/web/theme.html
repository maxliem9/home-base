<!DOCTYPE html>
<!--
  HomeBase Web — theme viewer. Same app as HomeBase.html, but forces a theme via
  ?theme=light|dark for screenshots (the app's Tweaks panel keeps theme in memory
  only, with no URL/localStorage hook). The app's theme effect only re-runs when a
  tweak changes, so a post-mount override of data-theme sticks. ?route= picks the view.
-->
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HomeBase — Theme</title>
  <link rel="stylesheet" href="src/styles.css" />
  <link rel="stylesheet" href="src/looks.css" />
  <link rel="stylesheet" href="src/views.css" />
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="src/seed.jsx"></script>
  <script type="text/babel" src="src/icons.jsx"></script>
  <script type="text/babel" src="src/ui.jsx"></script>
  <script type="text/babel" src="src/tweaks-panel.jsx"></script>
  <script type="text/babel" src="src/views_heute.jsx"></script>
  <script type="text/babel" src="src/views_aufgaben.jsx"></script>
  <script type="text/babel" src="src/views_einkauf.jsx"></script>
  <script type="text/babel" src="src/views_notizen.jsx"></script>
  <script type="text/babel" src="src/views_zeit.jsx"></script>
  <script type="text/babel" src="src/views_rezepte.jsx"></script>
  <script type="text/babel" src="src/app.jsx"></script>

  <script>
    // Force the requested theme. The app's effect sets data-theme from in-memory
    // state on mount/tweak-change only, so re-asserting here after mount wins and holds.
    (function () {
      var theme = new URLSearchParams(location.search).get("theme") === "dark" ? "dark" : "light";
      setInterval(function () { document.documentElement.setAttribute("data-theme", theme); }, 80);
    })();
  </script>
</body>
</html>
