ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.homebase.ApplicationKt.module ]
    }
}

database {
    url = ${DB_URL}
    user = ${DB_USER}
    password = ${DB_PASSWORD}
}

jwt {
    secret = ${JWT_SECRET}
    issuer = "homebase"
    audience = "homebase-users"
    realm = "HomeBase"
}

seed {
    users = ${?SEED_USERS}
}

app {
    householdName = "Mäxchen"
    householdName = ${?HOUSEHOLD_NAME}
    # Directory where uploaded note images are stored (mount a volume here in prod).
    uploadDir = "uploads"
    uploadDir = ${?UPLOAD_DIR}
    # Maximum accepted size per uploaded image, in megabytes.
    maxUploadMb = "10"
    maxUploadMb = ${?MAX_UPLOAD_MB}
    # Number of trusted reverse-proxy hops in front of the backend (prod: DSM + nginx = 2).
    # Used to pick the real client IP out of X-Forwarded-For for login throttling, spoof-resistantly.
    # Set to 0 when the backend is exposed directly (no proxy). See issue #8.
    trustedProxyCount = "2"
    trustedProxyCount = ${?TRUSTED_PROXY_COUNT}
}

telegram {
    botToken = ${?TELEGRAM_BOT_TOKEN}
    chatId = ${?TELEGRAM_CHAT_ID}
    digestTime = "20:00"
    digestTime = ${?DIGEST_TIME}
}

recurring {
    # Daily time the recurring-todo safety-net runs (rolls overdue recurring todos forward).
    time = "00:30"
    time = ${?RECURRING_TIME}
}
