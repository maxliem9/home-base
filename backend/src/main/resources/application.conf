ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.homebase.ApplicationKt.module ]
    }
}

database {
    url = ${DB_URL}
    user = ${DB_USER}
    password = ${DB_PASSWORD}
}

jwt {
    secret = ${JWT_SECRET}
    issuer = "homebase"
    audience = "homebase-users"
    realm = "HomeBase"
}

seed {
    users = ${?SEED_USERS}
}

app {
    householdName = "Mäxchen"
    householdName = ${?HOUSEHOLD_NAME}
}

telegram {
    botToken = ${?TELEGRAM_BOT_TOKEN}
    chatId = ${?TELEGRAM_CHAT_ID}
    digestTime = "20:00"
    digestTime = ${?DIGEST_TIME}
}
