ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.homebase.ApplicationKt.module ]
    }
}

database {
    url = ${DB_URL}
    user = ${DB_USER}
    password = ${DB_PASSWORD}
}

jwt {
    secret = ${JWT_SECRET}
    issuer = "homebase"
    audience = "homebase-users"
    realm = "HomeBase"
}

seed {
    users = ${?SEED_USERS}
}

app {
    # Default household name shown in the sidebar. Editable at runtime in
    # Einstellungen → Haushalt (persisted in app_settings); this is only the
    # bootstrap default for a fresh DB. No env override on purpose (#100/C6).
    householdName = "Mäxchen"
    # Directory where uploaded note images are stored (mount a volume here in prod).
    uploadDir = "uploads"
    uploadDir = ${?UPLOAD_DIR}
    # Maximum accepted size per uploaded image, in megabytes.
    maxUploadMb = "10"
    maxUploadMb = ${?MAX_UPLOAD_MB}
    # Number of trusted reverse-proxy hops in front of the backend (prod: DSM + nginx = 2).
    # Used to pick the real client IP out of X-Forwarded-For for login throttling, spoof-resistantly.
    # Set to 0 when the backend is exposed directly (no proxy). See issue #8.
    trustedProxyCount = "2"
    trustedProxyCount = ${?TRUSTED_PROXY_COUNT}
    # Public HTTPS domain of the deployment (no scheme/slash; same DOMAIN the deploy
    # health check uses). Set ⇒ browser requests are CORS-pinned to https://<domain>;
    # empty ⇒ any origin is allowed (local dev: vite :5173 against :8080).
    domain = ""
    domain = ${?DOMAIN}
}

telegram {
    botToken = ${?TELEGRAM_BOT_TOKEN}
    chatId = ${?TELEGRAM_CHAT_ID}
    # Default daily (evening) digest time. Editable at runtime in Einstellungen →
    # Benachrichtigungen (persisted in app_settings); this is only the bootstrap
    # default for a fresh DB. No env override on purpose (#100/C6).
    digestTime = "20:00"
    # Default daily morning-briefing time (due today / overdue / inbox / absences / kita).
    # Editable at runtime in Einstellungen → Benachrichtigungen (app_settings); bootstrap
    # default only. No env override on purpose (#100/C6).
    morningDigestTime = "07:00"
}

recurring {
    # Daily time the recurring-todo safety-net runs (rolls overdue recurring todos forward).
    time = "00:30"
    time = ${?RECURRING_TIME}
}

webpush {
    # VAPID keypair for browser Web Push (#429 Phase 2b). All three must be set for web push
    # to activate; unset ⇒ web push stays dormant (mirrors how Telegram is gated). Secrets —
    # env only, never in app_settings. Generate a keypair (see .env.example): the public key is
    # base64url (uncompressed P-256 point), the private key base64url. Subject is a contact URI
    # (mailto:... or https://...) per the VAPID spec.
    publicKey  = ${?VAPID_PUBLIC_KEY}
    privateKey = ${?VAPID_PRIVATE_KEY}
    subject    = ${?VAPID_SUBJECT}
}
