services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: homebase
      POSTGRES_USER: ${DB_USER:-homebase}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-homebase}
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-homebase} -d homebase"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata_dev:
