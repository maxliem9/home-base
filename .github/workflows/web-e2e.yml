name: Web E2E

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-e2e.yml'

# Least-privilege default: this workflow only checks out, builds and tests the web
# app — it never writes to the repo. Artifact upload uses the Actions runtime token,
# not GITHUB_TOKEN's contents scope.
permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Type-check the e2e suite against the app's real types (src/types.ts) so
      # fixture drift (e.g. a missing required field) fails here, before the
      # tests run. Cheap, so it goes ahead of the slow browser install.
      - name: Type-check e2e
        run: npm run typecheck:e2e

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
