name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: test/build jobs only read the checkout. The GITHUB_TOKEN
# otherwise inherits the repo default (often read-write-all) on pushes to main and
# repo-internal branches. Individual jobs raise this where needed — the docker job
# keeps its local `packages: write` to push to GHCR.
permissions:
  contents: read

jobs:
  # Detect which areas a PR touches so we only run the matching jobs — most PRs touch
  # one area, and there's no reason a web-only change should pay for the Android build
  # or the backend's Postgres job. On push to main every area job runs regardless (full
  # validation + image publish), so this filter is consulted only for pull_request events
  # (see each job's `if:`). Editing this workflow re-runs everything, by design.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    # On pull_request, dorny/paths-filter reads the changed-file list from the GitHub API
    # (listFiles), which needs pull-requests:read on top of the workflow's contents:read
    # default — without it the API returns "Resource not accessible by integration" and the
    # whole gate fails. On push it diffs via git and doesn't use this scope.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      android: ${{ steps.filter.outputs.android }}
      compose: ${{ steps.filter.outputs.compose }}
      icons: ${{ steps.filter.outputs.icons }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'
            android:
              - 'android/**'
              - '.github/workflows/ci.yml'
            compose:
              - 'docker-compose*.yml'
              - '.env.example'
              - '.github/workflows/ci.yml'
            icons:
              # Die drei duplizierten Einkaufs-Icon-Maps + ihr Drift-Guard.
              - 'web/src/components/shoppingIconMap.ts'
              - 'web/src/components/shoppingCategories.tsx'
              - 'android/app/src/main/kotlin/com/homebase/android/ui/shopping/ShoppingIcons.kt'
              - 'scripts/check-icon-map-parity.mjs'
              - '.github/workflows/ci.yml'

  icon-map-parity:
    name: Icon-Map Drift-Guard (Web ↔ Android)
    needs: changes
    # Die Name→Icon-Datei-Map ist in Web (shoppingIconMap.ts + shoppingCategories.tsx) und
    # Android (ShoppingIcons.kt) dupliziert und muss synchron bleiben (Issue #452). Reiner
    # Node-Regex-Diff, keine Dependencies/kein Build — läuft in Sekunden, daher eigenes
    # leichtgewichtiges Job statt Anhängsel am teuren web-/android-Build. Auf push immer,
    # auf PRs nur wenn eine der Maps oder das Skript berührt wurde.
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.icons == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Check icon-map parity
        run: node scripts/check-icon-map-parity.mjs

  backend:
    name: Backend tests
    needs: changes
    # !cancelled() lifts the implicit "needs succeeded" gate so a failure of the trivial
    # `changes` job can't silently skip the full push-to-main validation (which would go
    # green with nothing built); on a real cancel the job still stops.
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    # The unit suite builds its schema from Exposed via SchemaUtils on H2, bypassing Flyway
    # and the Postgres-specific types entirely — which is exactly how three schema/code-drift
    # bugs reached production (a fresh DB couldn't migrate, and todo writes 500'd; see the
    # V2/V7/V10 migrations). MigrationIntegrationTest runs the real migrations against this
    # throwaway Postgres and exercises the writes H2 can't, so that class of drift fails CI
    # instead of the NAS. It lives in the same suite (gated on a Postgres DB_URL), so a single
    # `gradle test` covers both layers — no second JDK/Gradle setup or recompile for it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: homebase
          POSTGRES_USER: homebase
          POSTGRES_PASSWORD: homebase
        ports:
          - 5432:5432
        # Don't start the test until Postgres accepts connections.
        options: >-
          --health-cmd "pg_isready -U homebase -d homebase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Backend pins source/target = 21 LTS (build.gradle.kts), so build on JDK 21.
      - name: Set up JDK 21
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      # One run, both layers. The unit tests use their own hardcoded H2 (TestHelpers builds a
      # MapApplicationConfig and bypasses DatabaseFactory, so DB_URL is irrelevant to them),
      # while MigrationIntegrationTest reads DB_URL from the env and migrates the real Postgres
      # service. Pointing DB_URL at the service is what makes the migration IT execute here
      # instead of self-skipping; the verify step below fails the job if it ever doesn't.
      - name: Run tests
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/homebase
          DB_USER: homebase
          DB_PASSWORD: homebase
        run: ./gradlew test --no-daemon

      # Guard against a silent skip re-creating the very blind spot the migration test exists to
      # close: if the Postgres gate weren't satisfied the test would report as skipped and the
      # job would still go green. Fail unless the suite actually executed with nothing skipped.
      #
      # Parse the <testsuite> attributes precisely rather than grepping the whole file: full-text
      # grep would go false-RED the moment a second migration test joins the class (the old
      # hardcoded tests="1"/tests="0" assumption), and a literal `skipped="0"` inside an assertion
      # message could mask a real skip. We assert tests>=1 AND skipped==0 (the original intent: an
      # assumption-not-met run turns the job RED), plus failures==0 && errors==0 as
      # belt-and-suspenders. The count check is decoupled from any fixed total, so future
      # migration tests don't need this step touched.
      - name: Verify the migration test was not skipped
        if: always()
        working-directory: backend
        run: |
          set -euo pipefail
          # Gradle writes exactly one file per test class; this path is a literal, not a glob —
          # so a plain existence check is the right "it never ran" detector.
          report="build/test-results/test/TEST-com.homebase.MigrationIntegrationTest.xml"
          if [ ! -f "$report" ]; then
            echo "::error::No result file for MigrationIntegrationTest — it never ran."
            exit 1
          fi
          # Read the <testsuite> opening-tag counters with grep — no xmllint/libxml2-utils
          # dependency (xmllint is not installed on the ubuntu runners). We still parse the
          # attributes, not full-file text: only the <testsuite> tag is scanned, so a literal
          # skipped="0" inside an assertion/error message can't mask a real skip.
          suite=$(grep -o '<testsuite[^>]*>' "$report" | head -1 || true)
          if [ -z "$suite" ]; then
            echo "::error::Could not find a <testsuite> element in $report."
            cat "$report"
            exit 1
          fi
          attr() { printf '%s' "$suite" | grep -oE " $1=\"[0-9]+\"" | grep -oE '[0-9]+' | head -1 || true; }
          tests=$(attr tests)
          skipped=$(attr skipped)
          failures=$(attr failures)
          errors=$(attr errors)
          echo "testsuite: tests=$tests skipped=$skipped failures=$failures errors=$errors"
          if [ "${tests:-0}" -lt 1 ] || [ "${skipped:-0}" -ne 0 ] \
             || [ "${failures:-0}" -ne 0 ] || [ "${errors:-0}" -ne 0 ]; then
            echo "::error::MigrationIntegrationTest was skipped or did not pass (DB_URL gate unmet?)."
            cat "$report"
            exit 1
          fi
          echo "MigrationIntegrationTest executed against Postgres. ✓"

      # Issue #9: everything above runs Flyway from the exploded Gradle classpath
      # (build/resources/main), but the NAS deploys the Shadow *fat jar* — and those two
      # classpaths can diverge. In #121 the packaged jar merged colliding
      # META-INF/services/*.Plugin files last-wins, dropping Flyway's SQL resolver; the
      # deployed app then applied ZERO migrations ("did not follow the filename convention"
      # → "No migrations found") and crash-looped on a missing "users" table, while every
      # test stayed green. The next two steps close that blind spot by exercising the real
      # deploy artifact: build the fat jar and boot it against a FRESH database exactly as a
      # new NAS volume would — migrate, then seed users — and prove the schema materialised.
      - name: Build the deployment fat jar
        working-directory: backend
        run: ./gradlew buildFatJar --no-daemon

      - name: Smoke-test fat-jar migrations against a fresh Postgres
        working-directory: backend
        env:
          PGPASSWORD: homebase
        run: |
          set -euo pipefail

          # psql for the assertions + creating a throwaway DB untouched by the test run
          # above, so Flyway has to apply every migration cold (the NAS's new-volume path).
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql -h localhost -U homebase -d homebase -c 'DROP DATABASE IF EXISTS homebase_smoke;'
          psql -h localhost -U homebase -d homebase -c 'CREATE DATABASE homebase_smoke;'

          # Boot the packaged jar with a user to seed: if the fat jar's Flyway resolver is
          # missing again, migrate() applies nothing, the seeder's first query hits a missing
          # "users" table, and the app dies before binding 8080 — the prod crash, in CI.
          log="$(mktemp)"
          DB_URL=jdbc:postgresql://localhost:5432/homebase_smoke \
          DB_USER=homebase DB_PASSWORD=homebase \
          JWT_SECRET=ci-smoke-secret \
          SEED_USERS=smoke:smokepw \
            java -jar build/libs/homebase-backend.jar > "$log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT

          # /api/v1/health only answers once module() finished — i.e. migrate() AND seeding
          # both succeeded. The loop returns the instant it's healthy (a warm boot is ~1s), so
          # the generous 90s budget only ever elapses on a genuine failure — headroom against a
          # cold/loaded runner's first JIT-cold `java -jar`. Bail early (dump log) if it exits.
          ready=0
          for _ in $(seq 1 90); do
            if curl -fsS http://localhost:8080/api/v1/health >/dev/null 2>&1; then
              ready=1; break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "::error::Fat jar exited during startup — migrations did not run (issue #9)."
              cat "$log"; exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Fat jar never became healthy within 90s."
            cat "$log"; exit 1
          fi

          # Belt-and-suspenders: the prod symptom was `relation "users" does not exist`, and a
          # partial-resolver regression could apply *some* migrations. Assert every V*.sql
          # landed in flyway_schema_history and the users table exists. The expected count is
          # derived from the files, so adding a migration needs no change here.
          expected="$(ls -1 src/main/resources/db/migration/V*.sql | wc -l | tr -d ' ')"
          applied="$(psql -h localhost -U homebase -d homebase_smoke -tAc \
            'SELECT count(*) FROM flyway_schema_history WHERE success AND version IS NOT NULL;')"
          echo "Fat jar applied $applied of $expected versioned migrations."
          if [ "$applied" -ne "$expected" ]; then
            echo "::error::Fat jar applied $applied/$expected migrations (resolver regressed?)."
            cat "$log"; exit 1
          fi
          users_exist="$(psql -h localhost -U homebase -d homebase_smoke -tAc \
            "SELECT to_regclass('public.users') IS NOT NULL;")"
          if [ "$users_exist" != "t" ]; then
            echo "::error::users table missing after fat-jar migration."
            cat "$log"; exit 1
          fi
          echo "Fat jar migrated a fresh DB and booted cleanly. ✓"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          if-no-files-found: ignore

  web:
    name: Web build
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # package-lock.json is committed, so use a clean, reproducible install (ci, not
      # install) then build (tsc + vite). Mirrors the web-e2e workflow.
      - name: Install dependencies
        working-directory: web
        run: npm ci

      # Run the Vitest unit suite (format.ts boundary/timezone helpers). The script
      # pins TZ=UTC via a shell prefix so the deterministic fake-timer assertions hold
      # on the runner; a red test fails the job and blocks the PR.
      - name: Unit tests
        working-directory: web
        run: npm run test:unit

      - name: Type-check and build
        working-directory: web
        run: npm run build

  android:
    name: Android tests
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.android == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Fast, toolchain-free tripwire against the Compose "non-weighted fillMax child starves its
      # weight(1f) sibling" layout trap (the PR #347 bottom-nav bug). Pure shell — runs before the
      # expensive Gradle/SDK setup so a violation fails in seconds. See scripts/check-compose-layout.sh.
      - name: Check Compose layout guard
        run: bash scripts/check-compose-layout.sh

      # AGP 8.7 targets JDK 17.
      - name: Set up JDK 17
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Run unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon

      # Issue #363: rerun the SAME unit tests in a single JVM in RANDOMISED class order to surface
      # order-dependent cross-test pollution (PR #359's leak only broke a *later*, unrelated test, so
      # the fixed-order suite above can't catch a regression of it). RandomOrderSuite logs the seed; on
      # a red run, replay locally with `./gradlew :app:testRandomOrderUnitTest -PtestOrderSeed=<seed>`.
      # Kept as its own step (not folded into the run above) so a randomised-order failure is
      # attributable and never makes the deterministic suite itself look flaky. `if: always()` runs it
      # even when the normal suite failed, so both signals show on one run; `--rerun-tasks` defeats
      # Gradle's up-to-date cache so a new random seed is drawn each CI run rather than reusing outputs.
      - name: Run unit tests in randomised order (pollution guard)
        if: always()
        working-directory: android
        run: ./gradlew :app:testRandomOrderUnitTest --no-daemon --rerun-tasks

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-test-report
          path: android/app/build/reports/tests
          if-no-files-found: ignore

  docker:
    name: Docker images build
    needs: changes
    # On push to main: build and publish both deployment images to GHCR so the NAS pulls them.
    # On a PR: only validate that the Dockerfile(s) for the area(s) that actually changed still
    # build — nothing is pushed. A PR touching neither backend/, web/, nor the compose files
    # skips this job entirely (the backend/web jobs already prove the code itself compiles), and
    # each image is built only when its own context changed, so a web-only PR never rebuilds the
    # backend image and vice versa.
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.compose == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push images to GHCR (main only)
    env:
      # ghcr.io/<owner>/<image> — owner must be lowercase
      BACKEND_IMAGE: ghcr.io/maxliem9/homebase-backend
      WEB_IMAGE: ghcr.io/maxliem9/homebase-web
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      # Login is only needed to push, which only happens on main.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The backend image compiles inside temurin:21 via the Gradle wrapper — must match the
      # backend's Java 21 LTS source/target. Built only when backend/ changed (or on main);
      # pushed only on main, otherwise built to validate the Dockerfile and discarded.
      - name: Build & push backend image
        if: ${{ github.event_name == 'push' || needs.changes.outputs.backend == 'true' }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push web image
        if: ${{ github.event_name == 'push' || needs.changes.outputs.web == 'true' }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ./web
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # Cheap structural check of the deployment compose file; run on main and on any PR that
      # touched the compose files or .env.example (the inputs it validates).
      - name: Validate docker-compose.yml
        if: ${{ github.event_name == 'push' || needs.changes.outputs.compose == 'true' }}
        run: |
          cp .env.example .env   # backend service declares env_file: .env
          docker compose config --quiet
