name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Backend pins sourceCompatibility = 24, so it needs a JDK that can target 24.
      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        working-directory: backend
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          if-no-files-found: ignore

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # package-lock.json is committed, so use a clean, reproducible install (ci, not
      # install) then build (tsc + vite). Mirrors the web-e2e workflow.
      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Type-check and build
        working-directory: web
        run: npm run build

  android:
    name: Android tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # AGP 8.7 targets JDK 17.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: android/app/build/reports/tests
          if-no-files-found: ignore

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Builds the deployment images so a broken Dockerfile fails CI instead of
      # surfacing on the NAS. The backend image compiles inside temurin:24 via
      # the Gradle wrapper — must match the backend's Java 24 source/target.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: homebase-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: false
          load: true
          tags: homebase-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env   # backend service declares env_file: .env
          docker compose config --quiet
