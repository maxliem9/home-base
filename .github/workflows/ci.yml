name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Backend pins sourceCompatibility = 24, so it needs a JDK that can target 24.
      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        working-directory: backend
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          if-no-files-found: ignore

  migrations:
    name: DB migrations (real Postgres)
    runs-on: ubuntu-latest
    # The unit suite builds its schema from Exposed via SchemaUtils on H2, bypassing Flyway
    # and the Postgres-specific types entirely — which is exactly how three schema/code-drift
    # bugs reached production (a fresh DB couldn't migrate, and todo writes 500'd; see the
    # V7/V9/V10 migrations). This job runs the real migrations against a throwaway Postgres
    # and exercises the writes H2 can't, so that class of drift fails CI instead of the NAS.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: homebase
          POSTGRES_USER: homebase
          POSTGRES_PASSWORD: homebase
        ports:
          - 5432:5432
        # Don't start the test until Postgres accepts connections.
        options: >-
          --health-cmd "pg_isready -U homebase -d homebase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # Mirror the backend job: Gradle runs on JDK 24, the build itself targets 21.
      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # MigrationIntegrationTest is gated on a Postgres DB_URL (it's skipped in the H2 unit
      # job and locally). Pointing DB_URL at the service container makes it run here.
      - name: Run migration integration test
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/homebase
          DB_USER: homebase
          DB_PASSWORD: homebase
        run: ./gradlew test --tests "com.homebase.MigrationIntegrationTest" --no-daemon

      # Guard against a silent skip re-creating the very blind spot this job exists to close:
      # if the gate weren't satisfied the test would be reported as skipped and the job would
      # still go green. Fail unless exactly one test actually executed.
      - name: Verify the migration test was not skipped
        if: always()
        working-directory: backend
        run: |
          report="build/test-results/test/TEST-com.homebase.MigrationIntegrationTest.xml"
          if [ ! -f "$report" ]; then
            echo "::error::No result file for MigrationIntegrationTest — it never ran."
            exit 1
          fi
          if ! grep -q 'tests="1"' "$report" || ! grep -q 'skipped="0"' "$report"; then
            echo "::error::MigrationIntegrationTest was skipped or did not run exactly once (DB_URL gate unmet?)."
            cat "$report"
            exit 1
          fi
          echo "MigrationIntegrationTest executed against Postgres. ✓"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-test-report
          path: backend/build/reports/tests/test
          if-no-files-found: ignore

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No package-lock.json in the repo, so install (not ci) and build (tsc + vite).
      - name: Install dependencies
        working-directory: web
        run: npm install

      - name: Type-check and build
        working-directory: web
        run: npm run build

  android:
    name: Android tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # AGP 8.7 targets JDK 17.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: android/app/build/reports/tests
          if-no-files-found: ignore

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Builds the deployment images so a broken Dockerfile fails CI instead of
      # surfacing on the NAS. The backend image compiles inside temurin:24 via
      # the Gradle wrapper — must match the backend's Java 24 source/target.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: homebase-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: false
          load: true
          tags: homebase-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env   # backend service declares env_file: .env
          docker compose config --quiet
