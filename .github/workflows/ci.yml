name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: test/build jobs only read the checkout. The GITHUB_TOKEN
# otherwise inherits the repo default (often read-write-all) on pushes to main and
# repo-internal branches. Individual jobs raise this where needed — the docker job
# keeps its local `packages: write` to push to GHCR.
permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Backend pins source/target = 21 LTS (build.gradle.kts), so build on JDK 21.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Run tests
        working-directory: backend
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          if-no-files-found: ignore

  migrations:
    name: DB migrations (real Postgres)
    runs-on: ubuntu-latest
    # The unit suite builds its schema from Exposed via SchemaUtils on H2, bypassing Flyway
    # and the Postgres-specific types entirely — which is exactly how three schema/code-drift
    # bugs reached production (a fresh DB couldn't migrate, and todo writes 500'd; see the
    # V2/V7/V10 migrations). This job runs the real migrations against a throwaway Postgres
    # and exercises the writes H2 can't, so that class of drift fails CI instead of the NAS.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: homebase
          POSTGRES_USER: homebase
          POSTGRES_PASSWORD: homebase
        ports:
          - 5432:5432
        # Don't start the test until Postgres accepts connections.
        options: >-
          --health-cmd "pg_isready -U homebase -d homebase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # Mirror the backend job: Gradle runs on JDK 21 LTS, matching the build's 21 target.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # MigrationIntegrationTest is gated on a Postgres DB_URL (it's skipped in the H2 unit
      # job and locally). Pointing DB_URL at the service container makes it run here.
      - name: Run migration integration test
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/homebase
          DB_USER: homebase
          DB_PASSWORD: homebase
        run: ./gradlew test --tests "com.homebase.MigrationIntegrationTest" --no-daemon

      # Guard against a silent skip re-creating the very blind spot this job exists to close:
      # if the gate weren't satisfied the tests would be reported as skipped and the job would
      # still go green. Fail unless the suite actually executed with nothing skipped.
      - name: Verify the migration test was not skipped
        if: always()
        working-directory: backend
        run: |
          report="build/test-results/test/TEST-com.homebase.MigrationIntegrationTest.xml"
          if [ ! -f "$report" ]; then
            echo "::error::No result file for MigrationIntegrationTest — it never ran."
            exit 1
          fi
          if grep -q 'tests="0"' "$report" || ! grep -q 'skipped="0"' "$report"; then
            echo "::error::MigrationIntegrationTest was skipped or never ran (DB_URL gate unmet?)."
            cat "$report"
            exit 1
          fi
          echo "MigrationIntegrationTest executed against Postgres. ✓"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-test-report
          path: backend/build/reports/tests/test
          if-no-files-found: ignore

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # package-lock.json is committed, so use a clean, reproducible install (ci, not
      # install) then build (tsc + vite). Mirrors the web-e2e workflow.
      - name: Install dependencies
        working-directory: web
        run: npm ci

      # Run the Vitest unit suite (format.ts boundary/timezone helpers). The script
      # pins TZ=UTC via a shell prefix so the deterministic fake-timer assertions hold
      # on the runner; a red test fails the job and blocks the PR.
      - name: Unit tests
        working-directory: web
        run: npm run test:unit

      - name: Type-check and build
        working-directory: web
        run: npm run build

  android:
    name: Android tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # AGP 8.7 targets JDK 17.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Run unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: android/app/build/reports/tests
          if-no-files-found: ignore

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push images to GHCR
    env:
      # ghcr.io/<owner>/<image> — owner must be lowercase
      BACKEND_IMAGE: ghcr.io/maxliem9/homebase-backend
      WEB_IMAGE: ghcr.io/maxliem9/homebase-web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # On main, publish the deployment images to GHCR so the NAS pulls them
      # instead of compiling from source. On PRs we still build (loaded locally)
      # so a broken Dockerfile fails CI, but nothing is pushed.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The backend image compiles inside temurin:21 via the Gradle wrapper —
      # must match the backend's Java 21 LTS source/target.
      - name: Build & push backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./web
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env   # backend service declares env_file: .env
          docker compose config --quiet
